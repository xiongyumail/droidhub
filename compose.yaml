name: droidhub

# 设备列表、密码、允许的域名在 data/config.json。.env 可设置：
#   DROIDHUB_LISTEN       监听地址，默认 127.0.0.1
#   DROIDHUB_PORT         端口，默认 8791
#   DROIDHUB_VERSION      镜像版本，默认 latest
#   DROIDHUB_ADB_RESTART  ADB 容器重启策略，默认 unless-stopped

x-hardening: &hardening
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  adb:
    <<: *hardening
    build:
      context: .
      target: adb
    # ADB 镜像按 adb 版本打标签，升级 droidhub 时不重建，USB 设备不需要重新认领
    image: ghcr.io/xiongyumail/droidhub:adb-37.0.1
    container_name: droidhub-adb
    restart: ${DROIDHUB_ADB_RESTART:-unless-stopped}
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 64
    stop_grace_period: 30s
    tmpfs: ["/tmp:size=16m,mode=1777"]
    environment:
      # libusb 后端监听内核热插拔事件并定时扫描。原生后端依赖宿主机 udev 消息，容器中收不到
      ADB_LIBUSB: "1"
      ADB_MDNS_AUTO_CONNECT: "none"
    # 挂载整个 USB 目录，只允许 USB 字符设备（主设备号 189）。设备重新插拔后节点号变化，
    # adb 扫描到新节点后自动恢复。只认领带 ADB 接口的设备，其他设备只读描述符
    device_cgroup_rules: ["c 189:* rmw"]
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      # adb 密钥，首次启动自动生成。换机器时复制旧密钥，设备不需要重新授权
      - ./data/adb:/root/.android
    # 只连接内部网络，无法访问外网；网络设备经 droidhub-net 转发
    networks: [adb_private, devices]
    healthcheck:
      test: [CMD, python3, /app/adb_health.py]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  # 网络设备的转发：在 devices 网络上监听，经 default 网络连接设备
  net:
    <<: *hardening
    image: ghcr.io/xiongyumail/droidhub:${DROIDHUB_VERSION:-latest}
    container_name: droidhub-net
    restart: unless-stopped
    command: [forward]
    mem_limit: 64m
    memswap_limit: 64m
    pids_limit: 64
    volumes:
      - ./data:/data:ro
    networks:
      devices:
        aliases: [droidhub-net]
      default: {}

  droidhub:
    <<: *hardening
    build:
      context: .
      target: web
    image: ghcr.io/xiongyumail/droidhub:${DROIDHUB_VERSION:-latest}
    container_name: droidhub-web
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2.0
    pids_limit: 256
    stop_grace_period: 30s
    tmpfs: ["/tmp:size=64m,mode=1777"]
    environment:
      ADB_SERVER_SOCKET: tcp:adb:5037
      DROIDHUB_ADB_HOST: adb
    ports:
      - "${DROIDHUB_LISTEN:-127.0.0.1}:${DROIDHUB_PORT:-8791}:8791"
    volumes:
      - ./data:/data
    networks: [default, adb_private]
    depends_on:
      adb:
        condition: service_healthy
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8791/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

networks:
  adb_private:
    internal: true
  devices:
    internal: true
